{% extends "base.html" %}

{% block title %}404 - Warp Zone Error | Mario: The Cyber Heist{% endblock %}

{% block content %}
<div class="challenge-page-container" style="max-width: 600px; text-align: center; margin-top: 80px;">
    <div class="cyber-card">
        <div style="font-size: 4rem; margin-bottom: 12px;">🍄 ❓ 🍄</div>
        <h1 style="font-family: var(--font-display); font-size: 1.5rem; color: var(--cyber-cyan); margin-bottom: 12px;">
            404: WARP PIPE ANOMALY
        </h1>
        <p style="color: #a0b5dd; font-size: 1rem; margin-bottom: 24px;">
            You have traversed into an unmapped coordinate in the Mushroom Kingdom network grid.
        </p>
        <a href="{{ url_for('game.index') }}" class="btn-primary">
            WARP TO TITLE SCREEN 🚀
        </a>
    </div>
</div>
{% endblock %}
