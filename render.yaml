services:
  - type: web
    name: mario-cyber-ctf
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt && python -c 'from models.db import init_database; init_database(reset=False, seed=True)'"
    startCommand: "gunicorn -c gunicorn.conf.py wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 5000
